career-profile:
    title: Career Profile
    summary: |
      Nuwan is a Lecturer at IIT, Sri Lanka, and a Graduate Research Assistant at the University of Moratuwa. 
      His primary areas of interest include the Internet of Things (IoT), Connected Devices, Middleware, and Distributed Systems.

      Nuwan spent his undergraduate years at the Informatics Institute of Technology (IIT), Colombo, 
      affiliated with the University of Westminster, UK. 
      He graduated in the class of 2019 with a First Class Honors in Computer Science. 
      After that, he followed a Research-based Masters at the University of Moratuwa, Sri Lanka, 
      where he undertook a project on fault-tolerant routing protocols for ad-hoc Wireless Sensor Networks.

      Nuwan is an Apache Committer, advocate, and contributor to multiple FOSS projects.
education:
    title: Education
    info:
      - degree: MSc in Computer Science
        university: University of Moratuwa, Sri Lanka
        time: 2024
        details: |
          Research-based Masters related to a project on Wireless Sensor Networks (WSN). 
          Proposed fault tolerant routing protocol for adhoc WSN.
          Undertook Fault Tolerance Computing module for credit fulfillment.
      - degree: BSc in Computer Science
        university: University of Westminster, UK
        time: 2019
        details: |
          Specialized in the multi-media pathway with a final year research
          project-based on middleware and Internet of Things. 
          Extra-curriculars involved:
            - IEEE
            - Rotaract Club

experiences:
    title: Experiences
    info:
      - role: Lecturer
        time: Aug 2023 - Present
        company: Informatics Institute of Technology (IIT), Sri Lanka
        details: |
          Worked in full-time basis supporting in the conducting of 
          2nd-year undergrad modules:
            - Object Oriented Programming
            - Software Development Group Project 
            - Professional Development 

          Working with 3rd-year placement co-ordination team.
          Designed and developed course content for Edge Artificial Intelligence modules
          affliated with Data Science degree by Robert Gordon University, Scotland.

      - role: Apache Committer
        time: Nov 2022 - Present
        company: Apache Software Foundation
        details: |
          Continuing work on developing core features for Apache
          Synapse project.

      - role: Graduate Research Assistant
        time: Sep 2019 - Present
        company: University of Moratuwa, Sri Lanka
        details: |
          Worked part-time researching and developing a 
          network level routing protocol that facilitates 
          M2M communication in Wireless Sensor Networks.
          Partially funded by grant from National Research Council, Sri Lanka.

      - role: Technical Evangelist
        time: May 2019 - Nov 2019
        company: Entgra Pvt Ltd, Sri Lanka
        details: |
          Developed product marketing material for the Entgra IoT Server 
          and performed evangelism via Medium detailing product applications.

      - role: Software Engineering Intern
        time: Jul 2017 - Jul 2018
        company: WSO2, Sri Lanka
        details: |
          Worked on the WSO2 IoT Server product implementing future release features. 
          Participated on around 10 projects, 
          including ones both assigned to me as well as ones initiated by me.

